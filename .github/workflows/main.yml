name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 👨🏻‍💻 Install dependencies
        run: bun install --frozen-lockfile

      - name: 👀 Run lint
        run: bun run lint

      - name: 🔍 Run check
        run: bun run check

      - name: 🧪 Run test
        run: bun run test
